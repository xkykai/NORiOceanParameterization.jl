name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  oceanstationpapa-cpu:
    name: OceanStationPapa CPU tests
    runs-on: ubuntu-latest

    env:
      JULIA_NUM_THREADS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate OceanStationPapa
        run: julia --project=OceanStationPapa -e 'using Pkg; Pkg.instantiate()'

      - name: Run OceanStationPapa tests
        run: julia --project=. test/runtests.jl
        env:
          TEST_FILTER: oceanstationpapa

  columnmodel-cpu:
    name: Column model inference CPU tests
    runs-on: ubuntu-latest

    env:
      JULIA_NUM_THREADS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate NORiImplementation
        run: julia --project=NORiImplementation -e 'using Pkg; Pkg.develop([Pkg.PackageSpec(path="."), Pkg.PackageSpec(path="OceanStationPapa")]); Pkg.instantiate()'

      - name: Run column model tests
        run: julia --project=. test/runtests.jl
        env:
          TEST_FILTER: columnmodel

  doublegyre-cpu:
    name: Double gyre inference CPU tests
    runs-on: ubuntu-latest

    env:
      JULIA_NUM_THREADS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate NORiImplementation
        run: julia --project=NORiImplementation -e 'using Pkg; Pkg.develop([Pkg.PackageSpec(path="."), Pkg.PackageSpec(path="OceanStationPapa")]); Pkg.instantiate()'

      - name: Run double gyre tests
        run: julia --project=. test/runtests.jl
        env:
          TEST_FILTER: doublegyre

  figure-scripts:
    name: Figure script tests
    runs-on: ubuntu-latest

    env:
      JULIA_NUM_THREADS: "1"
      DATADEPS_ALWAYS_ACCEPT: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Cache Julia DataDeps
        uses: actions/cache@v6
        with:
          path: ~/.julia/datadeps
          key: ${{ runner.os }}-julia-datadeps-${{ hashFiles('figure_scripts/**/Project.toml', 'figure_scripts/**/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-datadeps-

      - name: Instantiate figure scripts
        run: julia --project=figure_scripts -e 'using Pkg; Pkg.develop(Pkg.PackageSpec(path=".")); Pkg.instantiate()'

      - name: Instantiate OSPapa figure scripts
        run: julia --project=figure_scripts/ospapa -e 'using Pkg; Pkg.develop([Pkg.PackageSpec(path="."), Pkg.PackageSpec(path="OceanStationPapa")]); Pkg.instantiate()'

      - name: Run figure script tests
        run: julia --project=. test/runtests.jl
        env:
          TEST_FILTER: figures
