name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  oceanstationpapa-cpu:
    name: OceanStationPapa CPU tests
    runs-on: ubuntu-latest

    env:
      JULIA_NUM_THREADS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate OceanStationPapa
        run: julia --project=OceanStationPapa -e 'using Pkg; Pkg.instantiate()'

      - name: Run OceanStationPapa tests
        run: julia --project=. test/runtests.jl
        env:
          TEST_FILTER: oceanstationpapa

  columnmodel-cpu:
    name: Column model inference CPU tests
    runs-on: ubuntu-latest

    env:
      JULIA_NUM_THREADS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Develop local packages and instantiate NORiImplementation
        run: julia --project=NORiImplementation -e 'using Pkg; Pkg.develop(path="."); Pkg.develop(path="OceanStationPapa"); Pkg.instantiate()'

      - name: Run column model tests
        run: julia --project=. test/runtests.jl
        env:
          TEST_FILTER: columnmodel

  doublegyre-cpu:
    name: Double gyre inference CPU tests
    runs-on: ubuntu-latest

    env:
      JULIA_NUM_THREADS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Develop local packages and instantiate NORiImplementation
        run: julia --project=NORiImplementation -e 'using Pkg; Pkg.develop(path="."); Pkg.develop(path="OceanStationPapa"); Pkg.instantiate()'

      - name: Run double gyre tests
        run: julia --project=. test/runtests.jl
        env:
          TEST_FILTER: doublegyre
